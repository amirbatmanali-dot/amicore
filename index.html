<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0F1B3D">
<meta name="mobile-web-app-capable" content="yes">
<title>amicore</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* amicore: calm navy "core" card as the one bold element; everything else stays quiet. */
@font-face { font-family: 'VazirLocal'; src: url('../fonts/vazirmatn.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

:root {
  --bg: #F3F6FC;
  --surface: #FFFFFF;
  --surface2: #E9EEF8;
  --ink: #0F1B3D;
  --muted: #5F6C8C;
  --line: #D9E0EE;
  --navy: #0F1B3D;
  --on-navy: #F3F6FC;
  --navy-soft: #2A3A6B;
  --amber: #FF8A1F;
  --on-amber: #1B1000;
  --mint: #19B98A;
  --sky: #3B6BE0;
  --rose: #D63C4B;
  --shadow: 0 1px 2px rgba(15, 27, 61, .06), 0 6px 18px rgba(15, 27, 61, .06);
  --font: 'VazirLocal', 'Vazirmatn', 'Noto Naskh Arabic', Tahoma, sans-serif;
  --font-logo: 'Sora', 'Vazirmatn', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1128; --surface: #121C3A; --surface2: #1A2650; --ink: #E9EEFB; --muted: #8F9CC0; --line: #25315A;
    --navy: #16224A; --navy-soft: #33437A; --amber: #FF9A3C; --mint: #35D3A4; --sky: #7FA2FF; --rose: #FF7A86;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1128; --surface: #121C3A; --surface2: #1A2650; --ink: #E9EEFB; --muted: #8F9CC0; --line: #25315A;
  --navy: #16224A; --navy-soft: #33437A; --amber: #FF9A3C; --mint: #35D3A4; --sky: #7FA2FF; --rose: #FF7A86;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.7; direction: rtl; text-align: right; overscroll-behavior: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-left, 0px)) 6px max(16px, env(safe-area-inset-right, 0px)); }
.logo { font-family: var(--font-logo); font-weight: 700; font-size: 1.25rem; letter-spacing: -.02em; direction: ltr; }
.logo i { font-style: normal; color: var(--amber); }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); }
.icon-btn:hover { background: var(--surface2); }
main { flex: 1; min-height: 0; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
main > * { flex: none; }

nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: .78rem; border-radius: 12px; }
nav.tabs button[aria-current="true"] { color: var(--ink); font-weight: 700; }
nav.tabs button[aria-current="true"] svg { color: var(--amber); }

.hello { display: flex; flex-direction: column; gap: 0; }
.hello h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.4; text-wrap: balance; }
.hello p { color: var(--muted); font-size: .92rem; }

/* core card */
.core { background: var(--navy); color: var(--on-navy); border-radius: 24px; padding: 20px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.core .ring-wrap { position: relative; width: 150px; height: 150px; }
.core .ring-mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.2; }
.core .ring-mid b { font-size: 2rem; font-weight: 800; }
.core .ring-mid span { font-size: .75rem; opacity: .75; }
.core .facts { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fact { display: flex; align-items: center; gap: 10px; font-size: .92rem; }
.fact svg { color: var(--amber); width: 20px; height: 20px; }
.fact small { display: block; opacity: .7; font-size: .75rem; line-height: 1.3; }
.fact b { font-weight: 700; }
svg.seg-ring { width: 100%; height: 100%; }
.seg { fill: none; stroke: var(--navy-soft); stroke-width: 12; stroke-linecap: round; }
.seg.on { stroke: var(--amber); }
@media (max-width: 380px) { .core { grid-template-columns: 1fr; justify-items: center; } .core .facts { width: 100%; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.next { display: flex; flex-direction: column; gap: 10px; }
.next .lab { font-size: .78rem; color: var(--muted); letter-spacing: .02em; }
.next .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.next b { font-size: 1.15rem; }
.next .what { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 12px; font-weight: 700; background: var(--surface2); }
.btn.amber { background: var(--amber); color: var(--on-amber); }
.btn.navy { background: var(--navy); color: var(--on-navy); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { color: var(--rose); border: 1px solid var(--rose); background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.block { width: 100%; }

.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sec-title h2 { font-size: 1.05rem; font-weight: 800; }
.sec-title small { color: var(--muted); }

.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.item:last-child { border-bottom: 0; }
.item .box { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; margin-top: 2px; }
.item .box svg { width: 18px; height: 18px; stroke-width: 3; }
.item.done .box { background: var(--mint); border-color: var(--mint); color: #fff; }
.item.done .subj, .item.done .what { opacity: .55; text-decoration: line-through; text-decoration-thickness: 1px; }
.item .meta { min-width: 0; }
.item .tm { direction: ltr; unicode-bidi: isolate; display: inline-block; color: var(--muted); font-size: .8rem; }
.subj { font-weight: 700; }
.what { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: .7rem; border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-inline-start: 8px; font-weight: 500; vertical-align: 2px; }
.tag.review { color: var(--sky); }
.item.rest { grid-template-columns: 30px 1fr; opacity: .75; padding: 8px 0; }
.item.rest .box { border: 0; width: 28px; height: 28px; color: var(--muted); }
.item.rest .subj { font-weight: 500; color: var(--muted); font-size: .9rem; }
.item.rest .what { display: none; }

.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty p { color: var(--muted); max-width: 30ch; }

/* week strip */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dayb { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: .74rem; min-width: 0; }
.dayb[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.dayb.today span { color: var(--amber); font-weight: 800; }
.dayb svg { width: 30px; height: 30px; }
.mini-track { fill: none; stroke: var(--line); stroke-width: 4; }
.dayb[aria-pressed="true"] .mini-track { stroke: var(--navy-soft); }
.mini-val { fill: none; stroke: var(--amber); stroke-width: 4; stroke-linecap: round; }

/* coach */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-top-right-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--navy); color: var(--on-navy); border-top-left-radius: 4px; }
.msg.err { color: var(--rose); border-color: var(--rose); }
.dots { display: inline-flex; gap: 5px; padding: 6px 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.composer textarea, .field input, .field textarea { flex: 1; min-width: 0; width: 100%; resize: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; max-height: 7.5em; direction: rtl; }
.composer .send { width: 44px; height: 44px; border-radius: 12px; background: var(--amber); color: var(--on-amber); display: grid; place-items: center; flex: none; }
.composer .send svg { transform: scaleX(-1); }

/* progress */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px; text-align: center; }
.tile b { display: block; font-size: 1.35rem; font-weight: 800; line-height: 1.3; }
.tile span { color: var(--muted); font-size: .78rem; }
.bars-svg { width: 100%; height: auto; display: block; }
.bar-plan { fill: var(--surface2); }
.bar-done { fill: var(--amber); }
.bar-lab { fill: var(--muted); font-size: 10px; font-family: var(--font); text-anchor: middle; }
.bar-val { fill: var(--ink); font-size: 9px; font-family: var(--font); text-anchor: middle; }
.subj-row { display: grid; grid-template-columns: 6.5rem 1fr 3.2rem; gap: 10px; align-items: center; padding: 6px 0; font-size: .9rem; }
.subj-row .track { height: 10px; border-radius: 6px; background: var(--surface2); overflow: hidden; }
.subj-row .fill { height: 100%; background: var(--sky); border-radius: 6px; }
.subj-row small { color: var(--muted); text-align: left; }

/* overlays */
.overlay { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
.overlay .body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 24px max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.overlay .foot { padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; border-top: 1px solid var(--line); }
.overlay .foot .btn { flex: 1; }
.steps { display: flex; gap: 6px; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--amber); }
.big { font-size: 1.6rem; font-weight: 800; line-height: 1.4; text-wrap: balance; }
.lead { color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lab2 { font-size: .85rem; color: var(--muted); font-weight: 500; }
.seg-ctl { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg-ctl button { flex: 1; padding: 6px 4px; border-radius: 9px; font-size: .88rem; color: var(--muted); }
.seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
.sub-card { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.sub-card .hd { display: flex; justify-content: space-between; align-items: center; }
.sub-card .hd button { color: var(--muted); }
.range { width: 100%; accent-color: var(--amber); }
.row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.note { font-size: .85rem; color: var(--muted); }
.status { font-size: .88rem; }
.status.ok { color: var(--mint); } .status.bad { color: var(--rose); }

/* focus */
.focus { background: var(--navy); color: var(--on-navy); align-items: center; justify-content: center; text-align: center; gap: 22px; padding: 24px; }
.focus .big-ring { position: relative; width: min(72vw, 300px); aspect-ratio: 1; }
.focus .big-ring .t { position: absolute; inset: 0; display: grid; place-content: center; }
.focus .big-ring b { font-size: 3.2rem; font-weight: 800; direction: ltr; font-variant-numeric: tabular-nums; }
.focus .track { fill: none; stroke: var(--navy-soft); stroke-width: 10; }
.focus .val { fill: none; stroke: var(--amber); stroke-width: 10; stroke-linecap: round; }
.focus .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.focus .btn.ghost { border-color: var(--navy-soft); color: var(--on-navy); }

.toast { position: absolute; z-index: 40; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .9rem; max-width: 90%; text-align: center; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }

/* tools */
.tools { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.tool { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: right; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.tool svg { width: 26px; height: 26px; color: var(--amber); margin-bottom: 8px; }
.tool b { font-weight: 800; }
.tool span { color: var(--muted); font-size: .8rem; line-height: 1.5; }
.tool:active { transform: scale(.98); }
.badge { position: absolute; top: 12px; left: 12px; min-width: 24px; height: 24px; border-radius: 12px; padding: 0 7px; display: grid; place-items: center; background: var(--amber); color: var(--on-amber); font-style: normal; font-weight: 800; font-size: .8rem; }
.late { color: var(--rose); }

/* quiz */
.qtext { font-size: 1.2rem; font-weight: 800; line-height: 1.7; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: right; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); overflow-wrap: anywhere; }
.opt:not([disabled]):hover { border-color: var(--navy-soft); }
.opt.right { border-color: var(--mint); background: color-mix(in srgb, var(--mint) 16%, var(--surface)); }
.opt.wrong { border-color: var(--rose); background: color-mix(in srgb, var(--rose) 14%, var(--surface)); }

/* flashcards */
.flash { width: 100%; min-height: 220px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; }
.flash small { color: var(--muted); }
.flash span { font-size: 1.3rem; font-weight: 800; line-height: 1.7; overflow-wrap: anywhere; }
.flash em { font-style: normal; color: var(--muted); font-size: .85rem; }
.flash.back { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.flash.back small { color: var(--amber); }

/* level, goal, heatmap, badges */
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 2px 12px 2px 10px; border-radius: 999px; background: var(--surface2); font-size: .8rem; font-weight: 700; }
.pill svg { width: 16px; height: 16px; color: var(--amber); }
.chip.hot { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 16%, var(--surface)); font-weight: 700; }
.core.lvl { grid-template-columns: auto 1fr; }
.lvl-badge { width: 92px; height: 92px; border-radius: 50%; border: 6px solid var(--amber); display: grid; place-content: center; text-align: center; line-height: 1.1; }
.lvl-badge b { font-size: 2.2rem; font-weight: 800; }
.lvl-badge span { font-size: .72rem; opacity: .75; }
.xpbar, .goalbar { height: 10px; border-radius: 6px; overflow: hidden; background: var(--navy-soft); }
.goalbar { background: var(--surface2); margin: 8px 0 4px; }
.xpbar i, .goalbar i { display: block; height: 100%; border-radius: 6px; background: var(--amber); }
.hm { fill: var(--surface2); }
.hm.lf { fill: transparent; stroke: var(--line); stroke-width: 1; }
.hm.l1, .hm-dot.l1 { fill: color-mix(in srgb, var(--amber) 28%, var(--surface2)); background: color-mix(in srgb, var(--amber) 28%, var(--surface2)); }
.hm.l2, .hm-dot.l2 { fill: color-mix(in srgb, var(--amber) 55%, var(--surface2)); background: color-mix(in srgb, var(--amber) 55%, var(--surface2)); }
.hm.l3, .hm-dot.l3 { fill: color-mix(in srgb, var(--amber) 80%, var(--surface2)); background: color-mix(in srgb, var(--amber) 80%, var(--surface2)); }
.hm.l4, .hm-dot.l4 { fill: var(--amber); background: var(--amber); }
.hm-dot.l0 { background: var(--surface2); }
.legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: .72rem; color: var(--muted); margin-top: 6px; }
.hm-dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge2 { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; padding: 12px 6px; border-radius: 16px; border: 1px dashed var(--line); color: var(--muted); opacity: .6; min-width: 0; }
.badge2 svg { width: 28px; height: 28px; }
.badge2 b { font-size: .78rem; line-height: 1.4; }
.badge2 span { font-size: .66rem; line-height: 1.4; }
.badge2.on { opacity: 1; border-style: solid; border-color: var(--amber); color: var(--ink); background: color-mix(in srgb, var(--amber) 10%, var(--surface)); }
.badge2.on svg { color: var(--amber); }
.swatches { display: flex; gap: 12px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.item.edit, .item.rest.edit { grid-template-columns: 30px 1fr auto; }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; }
.icon-btn.sm svg { width: 18px; height: 18px; }
.item.moved { opacity: .55; }

/* motion: only when a tab opens, never on every tap */
.confetti { position: fixed; left: 50%; top: 62%; z-index: 80; pointer-events: none; }
.confetti i { position: absolute; width: 8px; height: 13px; border-radius: 2px; animation: conf 1.5s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes conf { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes ringin { from { transform: rotate(-70deg); opacity: .2; } to { transform: none; opacity: 1; } }
main.enter > * { animation: rise .38s both; }
main.enter > *:nth-child(2) { animation-delay: .05s; } main.enter > *:nth-child(3) { animation-delay: .1s; }
main.enter > *:nth-child(4) { animation-delay: .15s; } main.enter > *:nth-child(n+5) { animation-delay: .2s; }
main.enter .seg-ring { animation: ringin .8s cubic-bezier(.2, .7, .3, 1) both; }
@media (prefers-reduced-motion: reduce) { main.enter > *, main.enter .seg-ring { animation: none; } }

/* v3: learning tools + design polish */
.sdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 7px; vertical-align: 1px; flex: none; }
.chip .sdot { margin-inline-end: 6px; }

<script>
/* amicore planner: pure logic, no DOM. Works in the app and in Node tests. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Planner = factory();
})(this, function () {
  var DAYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
  var TYPES = { study: 1, review: 1, rest: 1 };

  var STUDY_TASKS = [
    'یادگیری مبحث جدید و نوشتن خلاصه‌ی خودت',
    'حل تمرین و مسئله‌های کتاب',
    'تست‌زنی و بررسی غلط‌ها',
    'مرور نکته‌ها و درست کردن فلش‌کارت'
  ];
  var EXAM_TASKS = [
    'حل نمونه‌سؤال امتحانی با زمان‌سنج',
    'رفع اشکال از سؤال‌هایی که غلط زدی',
    'مرور فصل‌های مهم و فرمول‌ها',
    'تست‌زنی سرعتی از کل مباحث'
  ];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(m) { m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function parse(t) { var m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
  function span(time) {
    var m = /(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/.exec(time || '');
    if (!m) return 0;
    var a = +m[1] * 60 + +m[2], b = +m[3] * 60 + +m[4];
    return b > a ? b - a : 0;
  }

  function todayIdx(date) { return ((date || new Date()).getDay() + 1) % 7; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function weekStart(date) {
    var d = new Date(date || new Date()); d.setHours(12, 0, 0, 0);
    d.setDate(d.getDate() - todayIdx(d));
    return iso(d);
  }
  function dateOf(dayIdx, date) {
    var parts = weekStart(date).split('-');
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2], 12);
    d.setDate(d.getDate() + dayIdx);
    return iso(d);
  }
  function daysUntil(dateStr, now) {
    if (!dateStr) return null;
    var p = dateStr.split('-'); if (p.length !== 3) return null;
    var a = new Date(+p[0], +p[1] - 1, +p[2], 12);
    var b = new Date(now || new Date()); b.setHours(12, 0, 0, 0);
    return Math.round((a - b) / 86400000);
  }

  /* Weighted round-robin: weak subjects appear more often, never twice in a row,
     weak subjects are placed first in the day (when energy is highest). */
  function build(p) {
    var subs = (p.subjects || []).filter(function (s) { return s && s.name; });
    if (!subs.length) subs = [{ name: 'درس‌ها', level: 2 }];
    var weightOf = function (s) { return s.level === 1 ? 3 : s.level === 3 ? 1 : 2; };
    var count = {}; subs.forEach(function (s) { count[s.name] = 0; });
    var session = p.session || 50, rest = p.rest == null ? 10 : p.rest;
    var start = parse(p.start); if (start == null) start = 16 * 60;
    var left = daysUntil(p.examDate);
    var examSoon = left != null && left >= 0 && left <= 10;
    var taskIdx = {};
    var prevFirst = null;
    var days = [];
    var studyDays = 0;

    for (var d = 0; d < 7; d++) {
      var avail = (p.minutesPerDay && p.minutesPerDay[d]) || 0;
      var items = [];
      var n = avail > 0 ? Math.max(1, Math.floor((avail + rest) / (session + rest))) : 0;
      var useReview = n >= 3 && prevFirst;
      var picks = [], last = null, i, k;
      var freshCount = useReview ? n - 1 : n;
      for (i = 0; i < freshCount; i++) {
        var best = null, bestScore = Infinity;
        for (k = 0; k < subs.length; k++) {
          var s = subs[k];
          if (subs.length > 1 && s.name === last) continue;
          var sc = (count[s.name] + 1) / weightOf(s);
          if (sc < bestScore - 1e-9 || (Math.abs(sc - bestScore) < 1e-9 && best && weightOf(s) > weightOf(best))) { best = s; bestScore = sc; }
        }
        best = best || subs[0];
        count[best.name]++; last = best.name; picks.push(best);
      }
      picks.sort(function (a, b) { return weightOf(b) - weightOf(a); });
      var seq = picks.map(function (s) { return { s: s, type: 'study' }; });
      if (useReview) seq.push({ s: { name: prevFirst }, type: 'review' });
      var t = start;
      seq.forEach(function (b, idx) {
        var len = b.type === 'review' ? Math.min(session, 30) : session;
        var task;
        if (b.type === 'review') task = 'مرور سریع نکته‌های ' + b.s.name + ' از روزهای قبل، بدون نگاه به کتاب';
        else {
          var list = examSoon ? EXAM_TASKS : STUDY_TASKS;
          taskIdx[b.s.name] = (taskIdx[b.s.name] || 0);
          task = list[taskIdx[b.s.name]++ % list.length];
        }
        items.push({ time: fmt(t) + '-' + fmt(t + len), subject: b.s.name, task: task, type: b.type });
        t += len;
        if (idx < seq.length - 1) {
          items.push({ time: fmt(t) + '-' + fmt(t + rest), subject: 'استراحت', task: 'آب بخور، کمی راه برو و از صفحه دور شو', type: 'rest' });
          t += rest;
        }
      });
      if (picks.length) { prevFirst = picks[0].name; studyDays++; }
      days.push({ day: DAYS[d], items: items });
    }

    var weak = subs.filter(function (s) { return s.level === 1; }).map(function (s) { return s.name; });
    var summary = 'برنامه‌ی ' + studyDays + ' روز مطالعه در هفته' +
      (weak.length ? ' با تمرکز بیشتر روی ' + weak.slice(0, 3).join(' و ') : '') +
      (examSoon ? '. امتحان نزدیک است، پس تمرین‌ها شکل امتحانی دارند.' : '.');
    var tips = [
      'درس سخت را اول وقت بخوان؛ تمرکزت آن موقع بهتر است.',
      'موقع استراحت گوشی دست نگیر تا ذهنت واقعاً خالی شود.',
      'هر شب پنج دقیقه نکته‌های همان روز را از حفظ مرور کن.'
    ];
    return normalize({ summary: summary, days: days, tips: tips });
  }

  /* Accepts a plan from the AI or from build() and returns a clean, id-tagged copy (or null). */
  function normalize(plan) {
    if (!plan || !Array.isArray(plan.days) || !plan.days.length) return null;
    var out = { summary: String(plan.summary || ''), tips: [], days: [] };
    if (Array.isArray(plan.tips)) out.tips = plan.tips.filter(function (x) { return typeof x === 'string'; }).slice(0, 4);
    for (var di = 0; di < 7; di++) {
      var src = null;
      for (var j = 0; j < plan.days.length; j++) if (plan.days[j] && plan.days[j].day === DAYS[di]) { src = plan.days[j]; break; }
      if (!src && plan.days.length === 7) src = plan.days[di];
      var items = [];
      ((src && src.items) || []).forEach(function (it) {
        if (!it || typeof it !== 'object') return;
        var type = TYPES[it.type] ? it.type : (/استراحت/.test(it.subject || '') ? 'rest' : 'study');
        items.push({ time: String(it.time || ''), subject: String(it.subject || ''), task: String(it.task || ''), type: type });
      });
      items.sort(function (a, b) { return (parse(a.time) || 0) - (parse(b.time) || 0); });
      items.forEach(function (it, ii) { it.id = di + '-' + ii; });
      out.days.push({ day: DAYS[di], items: items });
    }
    var any = out.days.some(function (x) { return x.items.length; });
    return any ? out : null;
  }

  function workItems(day) { return (day.items || []).filter(function (i) { return i.type !== 'rest' && !i.moved; }); }

  function endMin(day) {
    var e = 0;
    (day.items || []).forEach(function (i) { var m = /-(\d{1,2}):(\d{2})/.exec(i.time || ''); if (m) e = Math.max(e, +m[1] * 60 + +m[2]); });
    return e;
  }
  function sortDay(day) {
    day.items.sort(function (a, b) { return (parse(a.time) || 0) - (parse(b.time) || 0); });
  }

  /* Manual editing. */
  function addItem(plan, di, it) {
    var id = 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    var item = { id: id, time: it.time, subject: it.subject, task: it.task || '', type: it.type === 'review' ? 'review' : 'study' };
    plan.days[di].items.push(item); sortDay(plan.days[di]);
    return item;
  }
  function removeItem(plan, di, id) {
    var d = plan.days[di], n = d.items.length;
    d.items = d.items.filter(function (i) { return i.id !== id; });
    return n - d.items.length;
  }

  /* Move unfinished study blocks of past days to the lightest upcoming days (as review blocks). */
  function compensate(plan, done, todayIdx, ref) {
    var missed = [], di, j;
    for (di = 0; di < todayIdx; di++) {
      var date = dateOf(di, ref);
      workItems(plan.days[di]).forEach(function (i) { if (!done[date + '|' + i.id]) missed.push({ di: di, item: i }); });
    }
    if (!missed.length) return { moved: 0, added: 0 };
    var moved = 0, added = 0, left = Math.max(0, missed.length - 8);
    missed.slice(0, 8).forEach(function (m) {
      var len = Math.min(span(m.item.time) || 45, 45);
      var cands = [];
      for (var d = todayIdx; d < 7; d++) {
        var load = workItems(plan.days[d]).reduce(function (a, i) { return a + span(i.time); }, 0);
        cands.push({ d: d, load: load });
      }
      var busy = cands.filter(function (c) { return c.load > 0; });
      if (busy.length) cands = busy; // keep the student's rest days free when possible
      cands.sort(function (a, b) { return a.load - b.load || a.d - b.d; });
      var placed = false;
      for (j = 0; j < cands.length && !placed; j++) {
        var day = plan.days[cands[j].d];
        var extra = day.items.filter(function (i) { return /^جبران/.test(i.task); }).length;
        var start = day.items.length ? endMin(day) + 10 : 16 * 60;
        if (extra < 3 && start + len <= 22 * 60 + 30) {
          day.items.push({ id: 'c' + Date.now().toString(36) + moved + cands[j].d, time: fmt(start) + '-' + fmt(start + len), subject: m.item.subject, task: 'جبران: ' + m.item.task, type: 'review' });
          sortDay(day); placed = true;
        }
      }
      if (placed) { m.item.moved = true; moved++; added++; } else left++;
    });
    return { moved: moved, added: added, left: left };
  }

  function levelInfo(xp) {
    var lv = Math.floor(Math.sqrt(xp / 25)) + 1, base = 25 * (lv - 1) * (lv - 1), next = 25 * lv * lv;
    return { level: lv, xp: xp, base: base, next: next, pct: (xp - base) / (next - base) };
  }

  /* Per-day planned/done minutes for the current week. done is a map keyed "weekStart|itemId". */
  function weekStats(plan, done, ref) {
    var res = [];
    plan.days.forEach(function (d, di) {
      var planned = 0, got = 0, count = 0, finished = 0, bySubject = {};
      var date = dateOf(di, ref);
      workItems(d).forEach(function (i) {
        var m = span(i.time); planned += m; count++;
        if (done[date + '|' + i.id]) { got += m; finished++; bySubject[i.subject] = (bySubject[i.subject] || 0) + m; }
      });
      res.push({ planned: planned, done: got, count: count, finished: finished, bySubject: bySubject });
    });
    return res;
  }

  return { DAYS: DAYS, build: build, normalize: normalize, weekStart: weekStart, dateOf: dateOf, todayIdx: todayIdx,
           daysUntil: daysUntil, span: span, addItem: addItem, removeItem: removeItem, compensate: compensate, levelInfo: levelInfo, endMin: endMin, fmt: fmt, parse: parse, workItems: workItems, weekStats: weekStats, iso: iso };
});

<script>
/* amicore AI client. The app talks straight to the AI service the user configures in Settings.
   Nothing is sent anywhere else, and the key never leaves the phone except in requests to that service. */
(function () {
  var PRESETS = {
    openai: { label: 'سازگار با OpenAI', baseUrl: 'https://api.openai.com/v1', model: 'gpt-4o-mini' },
    anthropic: { label: 'Anthropic (Claude)', baseUrl: 'https://api.anthropic.com', model: 'claude-haiku-5-5' }
  };

  var SYS = [
    'تو «امی‌کور»، مربی هوشمند برنامه‌ریزی درسی برای دانش‌آموزان ایرانی هستی. فقط فارسی روان و صمیمی بنویس، کوتاه و کاربردی.',
    'می‌توانی به سؤال‌های درسی و روش مطالعه جواب بدهی و در صورت درخواست دانش‌آموز، برنامه‌ی هفتگی را بسازی یا اصلاح کنی.',
    'قوانین برنامه: هر ۷ روز را به ترتیب شنبه تا جمعه بده؛ هر روز ۲ تا ۶ بخش؛ درس سخت اول وقت؛ بعد از هر ۴۵ تا ۶۰ دقیقه استراحت کوتاه؛ مرور درس‌های قبل را بگنجان؛ هر بخش یک کار مشخص داشته باشد؛ type فقط study یا review یا rest؛ ساعت‌ها مثل 16:00-17:30 با ارقام انگلیسی. به ساعت‌ها و محدودیت‌هایی که دانش‌آموز گفته پایبند باش.',
    'خروجی فقط یک شیء JSON معتبر باشد، بدون توضیح اضافه و بدون بک‌تیک:',
    '{"reply":"پیام برای دانش‌آموز","plan":null}',
    'اگر برنامه ساختی یا تغییر دادی plan را کامل پر کن (همه‌ی ۷ روز):',
    '{"summary":"خلاصه‌ی ۱ تا ۲ جمله","days":[{"day":"شنبه","items":[{"time":"16:00-17:00","subject":"ریاضی","task":"کار مشخص","type":"study"}]}],"tips":["نکته ۱","نکته ۲"]}',
    'اگر نیازی به تغییر برنامه نبود plan را null بگذار.'
  ].join('\n');

  /* Inside Claude's artifact viewer there is no key and no outside network; ask Claude through the page capability instead. */
  var viaClaude = null;
  try { if (window.claude && window.claude.use) window.claude.use('sample').then(function (s) { viaClaude = s || null; }).catch(function () {}); } catch (e) {}

  function err(code, msg) { var e = new Error(msg || code); e.code = code; return e; }

  function extractJSON(t) {
    if (t && typeof t === 'object') return t;
    t = String(t || '');
    var s = t.indexOf('{'), e = t.lastIndexOf('}');
    if (s < 0 || e <= s) return null;
    try { return JSON.parse(t.slice(s, e + 1)); } catch (x) { return null; }
  }

  /* Try the main service; when its free quota runs out (or it is unreachable) use the backup service if one is set. */
  async function call(cfg, system, messages) {
    try { return await callOne(cfg, system, messages); }
    catch (e) {
      var fb = cfg && cfg.fbKey ? { provider: 'openai', apiKey: cfg.fbKey, baseUrl: cfg.fbUrl, model: cfg.fbModel } : null;
      if (fb && fb.baseUrl && (e.code === 'rate' || e.code === 'network' || e.code === 'timeout' || e.code === 'http' || e.code === 'model')) return await callOne(fb, system, messages);
      throw e;
    }
  }

  async function callOne(cfg, system, messages) {
    if (viaClaude) {
      var prompt = system + '\n\n--- گفتگو ---\n' + messages.map(function (m) { return (m.role === 'user' ? 'دانش‌آموز: ' : 'مربی: ') + m.content; }).join('\n') + '\n--- پایان ---\nپاسخ بعدی را بده.';
      try { var r = await viaClaude(prompt, { cache: false }); return r.text; }
      catch (e) { throw err(e && e.code === 'rate_limited' ? 'rate' : e && e.code === 'not_granted' ? 'auth' : 'http'); }
    }
    if (!cfg || !cfg.apiKey) throw err('no_key');
    var provider = cfg.provider === 'anthropic' ? 'anthropic' : 'openai';
    var base = String(cfg.baseUrl || PRESETS[provider].baseUrl).replace(/\/+$/, '');

      url = base + '/v1/messages';
      headers = { 'content-type': 'application/json', 'x-api-key': cfg.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
      body = { model: model, max_tokens: 4096, system: system, messages: messages };
    } else {
      url = base + '/chat/completions';
      headers = { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.apiKey };
      body = { model: model, messages: [{ role: 'system', content: system }].concat(messages) };
    }
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 90000);
    var res;
    try {
      res = await fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: ctl.signal });
    } catch (e) {
      clearTimeout(timer);
      throw err(e && e.name === 'AbortError' ? 'timeout' : 'network');
    }
    clearTimeout(timer);
    if (!res.ok) {
      throw err(res.status === 401 || res.status === 403 ? 'auth' : res.status === 429 ? 'rate' : res.status === 404 ? 'model' : 'http', 'HTTP ' + res.status);
    }
    var data;
    try { data = await res.json(); } catch (e) { throw err('bad_reply'); }
    var text = '';
    if (provider === 'anthropic') {
      text = (data.content || []).map(function (c) { return c.text || ''; }).join('');
    } else {
      text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content || '';
    }
    if (!text) throw err('bad_reply');
    return text;
  }

  function ctxText(ctx) {
    var s = '';
    if (ctx.profile) s += 'مشخصات دانش‌آموز (JSON): ' + JSON.stringify(ctx.profile) + '\n';
    if (ctx.plan) s += 'برنامه‌ی فعلی (JSON): ' + JSON.stringify({ summary: ctx.plan.summary, days: ctx.plan.days.map(function (d) { return { day: d.day, items: d.items.map(function (i) { return { time: i.time, subject: i.subject, task: i.task, type: i.type }; }) }; }) }) + '\n';
    if (ctx.today) s += 'امروز ' + ctx.today + ' است.\n';
    return s;
  }

  /* history: [{role:'user'|'assistant', content}] ending with a user message. Returns {reply, plan}. */
  async function chat(cfg, ctx, history) {
    var msgs = history.slice(-12).map(function (m) { return { role: m.role, content: m.content }; });
    var system = SYS + '\n\n' + ctxText(ctx);
    var text = await call(cfg, system, msgs);
    var j = extractJSON(text);
    if (j && typeof j.reply === 'string') return { reply: j.reply, plan: j.plan || null };
    return { reply: String(text).trim(), plan: null };
  }

  async function makePlan(cfg, ctx, note) {
    var ask = 'بر اساس مشخصات دانش‌آموز یک برنامه‌ی هفتگی کامل بساز.' + (note ? ' درخواست او: ' + note : '') + ' در reply یک جمله بگو برنامه آماده است.';
    var r = await chat(cfg, ctx, [{ role: 'user', content: ask }]);
    if (!r.plan) throw err('bad_reply');
    return r;
  }

  var BASE = 'تو «امی‌کور»، مربی هوشمند دانش‌آموزان ایرانی هستی. فقط فارسی روان بنویس. خروجی فقط یک شیء JSON معتبر باشد، بدون توضیح اضافه و بدون بک‌تیک.';

  async function askJSON(cfg, instruction) {
    var text = await call(cfg, BASE, [{ role: 'user', content: instruction }]);
    var j = extractJSON(text);
    if (!j) throw err('bad_reply');
    return j;
  }

  var LEVEL_GUIDE = {
    'آسان': 'مفهومی و پایه، مناسب مرور اول.',
    'متوسط': 'در سطح امتحان نهایی مدرسه؛ ترکیب مفهوم و کاربرد.',
    'سخت': 'سطح آزمون‌های چالشی (مثل تیزهوشان و آزمون‌های سنجش): تحلیلی و چندمرحله‌ای، ترکیب چند مفهوم، بدون سؤال تعریفی ساده.',
    'کنکوری': 'سطح کنکور سراسری ایران: بسیار چالشی، تحلیلی، با دام‌های رایج و گزینه‌های بسیار نزدیک به هم.'
  };

  /* One small batch of hard multiple-choice questions. Several batches are requested in parallel so the first
     questions appear quickly. Returns [{q, options[4], answer(0-3), explain}] */
  async function quizBatch(cfg, o) {
    var level = LEVEL_GUIDE[o.level] ? o.level : 'سخت';
    var grade = o.grade ? 'پایه‌ی ' + o.grade + (o.grade === 'کنکوری' ? ' (داوطلب کنکور سراسری)' : '') : 'دبیرستان';
    var src = o.source ? '\nفقط و فقط از متن زیر سؤال بساز (نه از بیرون آن):\n"""\n' + String(o.source).slice(0, 4000) + '\n"""\n' : '';
    var j = await askJSON(cfg, 'تو طراح سؤال باتجربه‌ی آزمون‌های ایران هستی. ' + o.n + ' سؤال چهارگزینه‌ای برای دانش‌آموز ' + grade + (o.field ? ' رشته‌ی ' + o.field : '') +
      ' درباره‌ی درس «' + o.subject + '»' + (o.topic ? ' و مبحث «' + o.topic + '»' : '') + ' بساز.' + src + '\n' +
      'سطح: ' + level + ' (' + LEVEL_GUIDE[level] + ')\n' +
      'این بخش ' + (o.part || 1) + ' از ' + (o.parts || 1) + ' بخش آزمون است؛ زیرمبحث‌هایت را طوری انتخاب کن که با بخش‌های دیگر تکراری نشود (شماره‌ی بخش = ' + (o.part || 1) + '، شناسه‌ی تنوع = ' + Math.floor(Math.random() * 9000 + 1000) + ').\n' +
      'قواعد: ۱) دقیقاً مطابق کتاب‌های درسی ایران برای همین پایه و درس؛ از پایه‌های پایین‌تر سؤال نپرس. ۲) هیچ سؤال تعریفی یا حفظی ساده نباش؛ همه تحلیلی یا چندمرحله‌ای باشند. ' +
      '۳) گزینه‌های غلط، اشتباه‌های رایج دانش‌آموزان و وسوسه‌کننده باشند؛ گزینه‌ها هم‌طول و هم‌سبک. ' +
      '۴) ادبیات: آرایه‌ها، قرابت معنایی، دستور زبان، تاریخ ادبیات، املا و معنی واژه و تحلیل بیت؛ دروس محاسباتی: مسئله‌ی چندگامی. ' +
      '۵) در فیلد explain اول سؤال را مرحله‌به‌مرحله حل کن (حداکثر سه جمله) و دلیل غلط بودن گزینه‌ی وسوسه‌کننده را بگو؛ بعد از آن answer را بنویس، تا جواب درست حتماً بررسی شده باشد. فقط یک گزینه درست باشد و جایگاه گزینه‌ی درست بین سؤال‌ها متنوع باشد. ' +
      '۶) فرمول‌ها را ساده و بدون LaTeX بنویس. ' +
      'ساختار (به همین ترتیب کلیدها): {"questions":[{"q":"متن سؤال","options":["گزینه ۱","گزینه ۲","گزینه ۳","گزینه ۴"],"explain":"حل و توضیح","answer":0}]} که answer شماره‌ی گزینه‌ی درست از ۰ تا ۳ است.');
    var qs = (j.questions || []).filter(function (x) {
      return x && typeof x.q === 'string' && Array.isArray(x.options) && x.options.length === 4 && Number.isInteger(x.answer) && x.answer >= 0 && x.answer <= 3;
    }).map(function (x) { return { q: x.q, options: x.options.map(String), answer: x.answer, explain: String(x.explain || '') }; });
    if (!qs.length) throw err('bad_reply');
    return qs;
  }

  /* Summary + flashcards from pasted study text. */
  async function summarize(cfg, text) {
    var j = await askJSON(cfg, 'متن درسی زیر را برای دانش‌آموز خلاصه کن و فلش‌کارت بساز.\nمتن:\n"""\n' + String(text).slice(0, 8000) + '\n"""\n' +
      'ساختار: {"summary":"خلاصه‌ی ۳ تا ۵ جمله","points":["نکته‌ی کلیدی ۱","نکته‌ی کلیدی ۲"],"cards":[{"front":"سؤال یا واژه","back":"جواب کوتاه"}]} با ۴ تا ۸ نکته و ۴ تا ۸ فلش‌کارت.');
    if (typeof j.summary !== 'string') throw err('bad_reply');
    j.points = Array.isArray(j.points) ? j.points.map(String).slice(0, 10) : [];
    j.cards = (Array.isArray(j.cards) ? j.cards : []).filter(function (c) { return c && c.front && c.back; }).map(function (c) { return { front: String(c.front), back: String(c.back) }; }).slice(0, 12);
    return j;
  }

  /* Weekly coaching report from numbers. */
  async function report(cfg, stats) {
    var j = await askJSON(cfg, 'این آمار هفته‌ی دانش‌آموز است (JSON): ' + JSON.stringify(stats) +
      '\nیک گزارش کوتاه و مهربان بنویس: نقطه‌های قوت، چیزی که باید بهتر شود، و ۳ پیشنهاد مشخص برای هفته‌ی بعد. ساختار: {"text":"گزارش در حداکثر ۱۲۰ کلمه"}');
    if (typeof j.text !== 'string') throw err('bad_reply');
    return j.text;
  }

  /* Day-by-day revision plan up to an exam. Returns [{when, focus}] */
  async function examPlan(cfg, o) {
    var j = await askJSON(cfg, 'یک برنامه‌ی مرور برای امتحان «' + o.name + '» که ' + o.days + ' روز دیگر است بساز. درس‌های دانش‌آموز (JSON): ' + JSON.stringify(o.subjects || []) +

      'ساختار: {"items":[{"when":"مثلاً روز ۱ یا ۵ روز مانده","focus":"چه چیزی و چقدر مرور شود"}]}');
    var items = (Array.isArray(j.items) ? j.items : []).filter(function (x) { return x && x.when && x.focus; }).map(function (x) { return { when: String(x.when), focus: String(x.focus) }; }).slice(0, 14);
    if (!items.length) throw err('bad_reply');
    return items;
  }

  /* Study tutor. mode: solve | explain | feynman | mnemonic */
  async function tutor(cfg, mode, o) {
    var who = 'دانش‌آموز ' + (o.grade || '') + (o.field ? ' رشته‌ی ' + o.field : '') + (o.subject ? '، درس ' + o.subject : '');
    var ins;
    if (mode === 'solve') {
      ins = who + ' این مسئله را حل نمی‌کند:  + o.text + . جواب را فوراً نده. اول سه راهنمایی تدریجی بده (اولی کلی، دومی مشخص‌تر، سومی تقریباً کامل)، بعد پاسخ کامل مرحله‌به‌مرحله و یک راه ساده برای بررسی درستی جواب. فرمول‌ها را بدون LaTeX بنویس. ' +
        'ساختار: {"hints":["راهنمایی ۱","راهنمایی ۲","راهنمایی ۳"],"solution":"پاسخ کامل مرحله‌به‌مرحله","check":"راه بررسی"}';
    } else if (mode === 'explain') {
      ins = who + ' این مبحث را نمی‌فهمد:  + o.text + . ساده و با مثال توضیح بده، بعد یک تشبیه روزمره بیاور. ساختار: {"text":"توضیح ساده","example":"یک مثال حل‌شده یا ملموس","analogy":"تشبیه روزمره"}';
    } else if (mode === 'feynman') {
      ins = who + ' مبحث «' + o.text + '» را با زبان خودش این‌طور توضیح داده (روش فاینمن):  + o.mine + . توضیح خودش را مثل یک معلم مهربان ارزیابی کن: نمره‌ی ۰ تا ۱۰، چیزهای درست، چیزهای جاافتاده یا غلط، و یک نسخه‌ی اصلاح‌شده‌ی کوتاه. ' +
        'ساختار: {"score":7,"good":["نکته‌ی درست"],"missing":["نکته‌ی جاافتاده یا غلط"],"fix":"نسخه‌ی اصلاح‌شده"}';
    } else {
      ins = who + ' باید این را حفظ کند:  + o.text + . یک ترفند حفظی خلاقانه به فارسی بساز (جمله‌ی کوتاه، قافیه یا کلمه‌ی اول‌حرف‌ها) و توضیح بده چطور با مطلب ربط دارد. ساختار: {"mnemonic":"ترفند حفظی","how":"توضیح ربط آن با مطلب"}';
    }
    var j = await askJSON(cfg, ins);
    if (mode === 'solve') {
      var h = (Array.isArray(j.hints) ? j.hints : []).map(String).filter(Boolean).slice(0, 4);
      if (!h.length || typeof j.solution !== 'string') throw err('bad_reply');
      return { hints: h, solution: j.solution, check: String(j.check || '') };
    }
    if (mode === 'explain') {
      if (typeof j.text !== 'string') throw err('bad_reply');
      return { text: j.text, example: String(j.example || ''), analogy: String(j.analogy || '') };
    }
    if (mode === 'feynman') {
      var sc = Math.round(+j.score);
      if (isNaN(sc)) throw err('bad_reply');
      return { score: Math.max(0, Math.min(10, sc)), good: (Array.isArray(j.good) ? j.good : []).map(String).slice(0, 5), missing: (Array.isArray(j.missing) ? j.missing : []).map(String).slice(0, 5), fix: String(j.fix || '') };
    }
    if (typeof j.mnemonic !== 'string') throw err('bad_reply');
    return { mnemonic: j.mnemonic, how: String(j.how || '') };
  }

  async function test(cfg) {
    var text = await call(cfg, 'فقط یک کلمه جواب بده.', [{ role: 'user', content: 'سلام' }]);
    return String(text).slice(0, 40);
  }

  window.AmiAI = { available: function () { return !!viaClaude; }, PRESETS: PRESETS, chat: chat, makePlan: makePlan, test: test, quizBatch: quizBatch, tutor: tutor, examPlan: examPlan, summarize: summarize, report: report };
})();

    var tEl = document.getElementById('f-time'), vEl = document.getElementById('f-val');

    if (vEl) { var C = 2 * Math.PI * 100; vEl.setAttribute('stroke-dasharray', (C * elapsed / focus.total).toFixed(1) + ' ' + C.toFixed(1)); }
    if (left <= 0 && focus.running) { focus.running = false; finishFocus(true); }
  }

  $app.addEventListener('input', function (ev) {

    if (t.id === 'ob-name') ob.d.name = t.value;
    else if (t.id === 'ob-min') { ob.d.minutes = +t.value; var o = document.getElementById('ob-min-v'); if (o) o.textContent = mins(ob.d.minutes); }
    else if (t.id === 'ob-start') ob.d.start = t.value;
    else if (t.id === 'ob-exam') ob.d.examDate = t.value;
    else if (t.id === 'st-rem') { S.reminder.time = t.value || '16:00'; save(); if (S.reminder.on) applyReminder(); }
    else if (t.id === 'tu-subject') tu.subject = t.value;
    else if (t.id === 'tu-text') tu.text = t.value;
    else if (t.id === 'tu-mine') tu.mine = t.value;
    else if (t.id === 'tp-subject') tp.f.subject = t.value;
    else if (t.id === 'tp-name') tp.f.name = t.value;
    else if (t.id === 'tp-note') tp.f.note = t.value;
    else if (t.id === 'gr-subject') gr.subject = t.value;
    else if (t.id === 'gr-score') gr.score = t.value;
    else if (t.id === 'gr-total') gr.total = t.value;
    else if (t.id === 'gr-correct') gr.correct = t.value;
    else if (t.id === 'gr-wrong') gr.wrong = t.value;
    else if (t.id === 'gr-date') gr.date = t.value;
    else if (t.id === 'gr-target') { S.targetAvg = +t.value; save(); var tv = document.getElementById('tg-v'); if (tv) tv.textContent = fnum(S.targetAvg); }
    else if (t.id === 'ni-subject') ni.subject = t.value;
    else if (t.id === 'ni-task') ni.task = t.value;
    else if (t.id === 'ni-start') ni.start = t.value;
    else if (t.id === 'fr-subject') fr.subject = t.value;
    else if (t.id === 'st-goal') { S.goalHours = +t.value; save(); var gv = document.getElementById('goal-v'); if (gv) gv.textContent = fa(S.goalHours) + ' ساعت'; }
    else if (t.id === 'qz-subject') qz.subject = t.value;
    else if (t.id === 'qz-topic') qz.topic = t.value;
    else if (t.id === 'sm-text') sm.text = t.value;
    else if (t.id && t.id.indexOf('st-') === 0 && t.id !== 'st-import' && t.id !== 'st-goal') readSettings();
    else if (t.id === 'cin') { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; }
  });
  $app.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'cform') return;
    ev.preventDefault();
    var el = document.getElementById('cin'), v = el.value; el.value = ''; el.style.height = 'auto';
    sendChat(v);
  });
  $app.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'cin' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); document.getElementById('cform').requestSubmit(); }
  });

  if (!S.profile) { startOnboard(); } else render();
})();

</script>
</body>
